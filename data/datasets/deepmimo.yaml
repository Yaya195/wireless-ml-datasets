  doi: null
  notes: null
- id: dyloc-localization
  type: paper
  title: 'DyLoc: Dynamic Localization for Massive MIMO Using Predictive Recurrent Neural Networks'
  url: https://doi.org/10.1109/INFOCOM42981.2021.9488913
  doi: 10.1109/INFOCOM42981.2021.9488913
