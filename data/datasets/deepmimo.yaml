  url: https://doi.org/10.3390/e28020154
  doi: 10.3390/e28020154
  notes: Peer-reviewed 2026 study that evaluates wideband beamspace channel estimation on DeepMIMO ray-traced channel realizations.
- id: maintainer-radio-slam
  type: other
  title: UQAM seminar on AI-native wireless systems, localization, and Radio SLAM
  url: https://evenements.uqam.ca/evenements/yaya-etiabi-ai-aided-and-ai-oriented-integrated-sensing-communication-and-computing/34058
  doi: null
  notes: Public seminar page documenting the catalogue maintainer's Radio-SLAM research; use of DeepMIMO in the associated
    Radio-SLAM experimental workflow is directly confirmed by the maintainer.
tasks:
- task: beam-prediction
  scope: Scenario and configuration dependent; the original DeepMIMO work demonstrates a mmWave beam-prediction application.
  inputs:
  - channel-matrix
  targets:
  - beam-index
  evidence:
  - deepmimo-paper
  notes: null
  context:
    frequency_regimes:
    - mmwave
- task: localization
  scope: Dynamic massive-MIMO localization from DeepMIMO-generated geo-tagged CSI/angle-delay representations.
  inputs:
  - channel-matrix
  targets:
  - position
  evidence:
  - dyloc-localization
  notes: DyLoc explicitly uses DeepMIMO to generate geo-tagged CSI datasets for localization in indoor and outdoor dynamic
    scenarios.
  context:
    environments:
    - indoor
    - outdoor
    mobility: mobile
    frequency_regimes:
    - mmwave
- task: channel-estimation
  scope: Evaluate learned wideband/beamspace massive-MIMO channel estimators using realistic DeepMIMO ray-traced channel realizations.
  inputs:
  - channel-matrix
  targets:
  - channel
  evidence:
  - wideband-channel-estimation
  notes: The cited study generates DeepMIMO channel realizations and derives beamspace measurements for channel-estimation
    evaluation.
  context:
    environments:
    - outdoor
    mobility: static
    frequency_regimes:
    - mmwave
- task: radio-slam
  scope: Evaluate radio-geometric SLAM from ray-traced multipath delay/angle observations, receiver/transmitter positions,
    and interaction-point geometry generated from DeepMIMO scenarios.
  inputs:
  - path-parameters
  - scene-geometry
  targets:
  - position
  - scene-geometry
  evaluation_reference:
  - position
  - scene-geometry
  evidence:
  - official-repo
  - database-docs
  - maintainer-radio-slam
  notes: This mapping is based on documented DeepMIMO geometry plus maintainer-confirmed use in Radio-SLAM experiments; DeepMIMO
    is also broadly SLAM-capable because it exposes AoA/AoD, delays, interaction types/points, and scene geometry.
  context:
    mobility: configurable
    frequency_regimes:
    - mmwave
    - sub-thz
caveats:
- text: DeepMIMO is a collection/toolchain rather than one fixed dataset; scenario and generation choices materially determine
    the resulting data.
  evidence:
  - official-repo
  - database-docs
