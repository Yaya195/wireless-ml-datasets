- task: network-fault-diagnosis
  scope: Localize Open-RAN performance failures to the responsible KPI/component set after anomaly detection.
  inputs:
  - network-kpi
  targets:
  - anomaly-label
  evidence:
  - mobicom-paper
  notes: SpotLight explicitly includes an explainability/root-cause phase that identifies a minimal set of KPIs
