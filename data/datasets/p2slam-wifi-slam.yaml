status: verified
resource_type: dataset-collection
description: A real-world indoor robotics dataset collection for bearing-based Wi-Fi SLAM, combining reciprocal Wi-Fi CSI/RSSI
  with robot odometry, IMU, camera, LiDAR, AP geometry, and Cartographer-derived pose ground truth across multiple trajectories
  and environments.
released:
  year: 2022
  notes: Released with the IEEE Robotics and Automation Letters P2SLAM study; a later WAIS release adds an additional Wi-Fi-assisted
    SLAM dataset to the same project lineage.
origin:
  type: measurement
  notes: Measurements were collected using a Turtlebot2 with reciprocal Wi-Fi channel sensing and synchronized robotics sensors
    in two indoor environments at UC San Diego.
modalities:
- wifi-csi
- rss
- odometry
- imu
- camera
- lidar
- position
- scene-geometry
