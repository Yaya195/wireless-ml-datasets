description: A collection of time-consistent ray-tracing datasets with mobility, channel data, and optional RGB/LiDAR
  modalities for beam management, blockage, channel prediction, and localization research.
released:
  year: 2018
  notes: The first Raymobtime scenarios were published in 2018; the collection has since expanded with multimodal,
    V2V, indoor, and beam-tracking scenarios.
origin:
  type: ray-tracing
  notes: Wireless channels are generated with Remcom Wireless InSite over dynamic 3D scenarios with mobility modeled
    using SUMO and related tools.
