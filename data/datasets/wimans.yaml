- task: device-free-localization
  scope: Recognize the discrete indoor location of one or more people from dual-band Wi-Fi CSI without requiring
    them to carry a radio device.
  inputs:
  - wifi-csi
  targets:
  - position
  evidence:
  - official-repo
  - eccv-paper
  notes: WiMANS benchmarks a location task over five labeled locations (A–E) per environment; the target is categorical
    location rather than continuous metric coordinates.
  context:
    environments:
    - indoor
    mobility: not-applicable
    frequency_regimes:
    - sub-6-ghz
