- task: signal-classification
  scope: Classify received RF observations according to the active LTE/Wi-Fi signal configuration.
  inputs:
  - iq
  targets:
  - signal-class
  evidence:
  - data-gov
  notes: The NIST metadata explicitly lists signal classification as a supported research use.
  context:
    environments:
    - laboratory
    mobility: static
    frequency_regimes:
    - sub-6-ghz
caveats:
- text: The dataset is a controlled coexistence measurement campaign with a small number of configured link cases;
