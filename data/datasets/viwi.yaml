tasks:
- task: beam-prediction
  scope: ViWi applications use visual observations, optionally with wireless context, to predict mmWave beams.
  inputs:
  - camera
  targets:
  - beam-index
  evidence:
  - viwi-applications
  notes: null
  context:
    environments:
    - outdoor
    - urban
    - vehicular
    mobility: mobile
    frequency_regimes:
    - mmwave
- task: blockage-prediction
  scope: ViWi supports vision-aided future blockage prediction using image sequences and, in some formulations,
    sub-6 GHz channel information.
  inputs:
  - camera
  - channel-matrix
  targets:
  - blockage-status
  evidence:
  - viwi-applications
  notes: null
  context:
    environments:
    - outdoor
    - urban
    - vehicular
    mobility: mobile
    frequency_regimes:
    - sub-6-ghz
    - mmwave
- task: beam-tracking
  scope: The ViWi-BT dataset uses sequences of observed RGB images and beam indices to predict future mmWave beams.
  inputs:
  - camera
  targets:
  - beam-index
  evidence:
  - viwi-bt
  notes: Historical ViWi-BT development data were distributed as MAT, CSV, and H5 packages.
  context:
    environments:
    - outdoor
    - urban
    - vehicular
    mobility: mobile
    frequency_regimes:
    - mmwave
caveats:
- text: ViWi is a scenario-generation framework/family rather than one immutable dataset; exact modalities and labels
    depend on the selected scenario, version, and generated configuration.
  evidence:
