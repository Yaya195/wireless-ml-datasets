id: viwi
name: ViWi
aliases:
- ViWi Dataset
identity:
  canonical_url: https://www.viwi-dataset.net/
  version: null
  external_ids: []
status: verified
resource_type: dataset-family
description: A vision-aided wireless dataset framework and scenario family combining rendered RGB/LiDAR context
  with ray-traced mmWave wireless data for beam and blockage research.
released:
  year: 2019
  notes: The original ViWi framework was released in 2019; later versions and the ViWi-BT challenge added scenarios
    and sequential beam-tracking data.
origin:
  type: ray-tracing
  notes: Wireless channels are produced from virtual scenarios with Remcom Wireless InSite; visual and scene modalities
    are rendered from the same environments.
modalities:
- channel-matrix
- camera
- lidar
- position
- scene-geometry
technologies:
- 6g
generation_contexts:
- 5g
- 6g
radio_configurations:
- mimo
- phased-array
frequency:
  status: varies
  regimes:
  - sub-6-ghz
  - mmwave
  bands:
  - label: 28 GHz
    center_ghz: 28.0
    min_ghz: null
    max_ghz: null
  notes: Core ViWi scenarios include 28 GHz mmWave links; some published ViWi applications combine visual data with
    sub-6 GHz channels.
environments:
- outdoor
- urban
- vehicular
mobility:
  type: mobile
  notes: Public scenarios model moving cars/users over defined trajectories.
temporal_structure: sequence
formats:
- mat
- csv
- h5
- png
ground_truth:
- beam-index
- blockage-status
- position
- channel
