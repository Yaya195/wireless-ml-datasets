tasks:
- task: network-anomaly-detection
  scope: Detect anomalous operating periods from multi-layer 5G KPI time series and contextual observability data.
  inputs:
  - network-kpi
  targets:
  - anomaly-label
  evidence:
  - official-repo
  - paper
  notes: The dataset explicitly supports binary anomaly detection and anomaly-duration localization.
  context:
    environments:
    - laboratory
    mobility: mixed
    frequency_regimes: []
- task: network-fault-diagnosis
  scope: Identify the root cause of 5G network anomalies from KPI time series, contextual metadata, and troubleshooting information.
  inputs:
  - network-kpi
  - text
  targets:
  - anomaly-label
  evidence:
  - official-repo
  - paper
  notes: Root-cause analysis is an explicit multi-class downstream task; natural-language Q&A also supports multimodal diagnostic reasoning.
  context:
    environments:
    - laboratory
    mobility: mixed
    frequency_regimes: []
collections:
- llm-foundation-model-resources
caveats:
- text: The phrase "anomaly duration localization" refers to temporal sequence labeling of an anomaly interval, not spatial wireless localization; do not map this record to the localization task on that basis.
  evidence:
  - official-repo
  - hf-card
- text: The application label is contextual metadata used in descriptions and Q&A; it is not by itself evidence of a demonstrated traffic-classification benchmark, so no traffic-classification mapping is asserted.
  evidence:
  - official-repo
  - hf-card
- text: The anomaly corpus mixes synthetic fault types with one real over-the-air jamming anomaly, so results should distinguish controlled anomaly generation from naturally occurring field failures.
  evidence:
  - official-repo
