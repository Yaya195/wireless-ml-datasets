tasks:
- task: channel-extrapolation
  scope: Infer unobserved XL-MIMO channel coefficients from partially observed channel measurements.
  inputs:
  - channel-matrix
  targets:
  - channel
  evidence:
  - dataset-card
  - jstsp-paper
  notes: The associated work explicitly evaluates zero-shot channel extrapolation from incomplete channel observations.
  context:
