  - channel-matrix
  targets:
  - position
  evidence:
  - jstsp-paper
  notes: Localization is evaluated as a downstream task of the learned channel representation.
  context:
    environments:
    - outdoor
    - urban
    - suburban
    - aerial
    mobility: mobile
    frequency_regimes: []
