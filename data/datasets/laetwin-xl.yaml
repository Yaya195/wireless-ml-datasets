    - outdoor
    - urban
    - suburban
    - aerial
    mobility: mobile
    frequency_regimes: []
- task: channel-estimation
  scope: Estimate/reconstruct full channel information from sparse or incomplete channel observations.
  inputs:
  - channel-matrix
  targets:
  - channel
  evidence:
  - jstsp-paper
  notes: Channel estimation is evaluated as a downstream transfer task in the associated work.
  context:
