tasks:
- task: blockage-prediction
  scope: Predict future blockage state from synchronized visual and radio observations in the controlled indoor mmWave setup.
  inputs:
  - camera
  - channel-matrix
  targets:
  - blockage-status
  evidence:
  - zenodo-record
  - challenge-page
  - icassp-paper
  notes: The released annotations distinguish no, partial, and full blockage states.
  context:
    environments:
    - indoor
    - laboratory
    mobility: configurable
    frequency_regimes:
    - mmwave
- task: localization
  scope: Estimate UE position from the synchronized multimodal observations used in the challenge localization track.
  inputs:
  - camera
  - channel-matrix
  targets:
  - position
  evidence:
  - zenodo-record
  - challenge-page
  - icassp-paper
  notes: The released Task 2 annotations provide UE translation coordinates and the challenge evaluates localization with position RMSE.
  context:
    environments:
    - indoor
    - laboratory
    mobility: configurable
    frequency_regimes:
    - mmwave
- task: channel-prediction
  scope: Predict future SRS channel measurements from synchronized visual and radio observations.
  inputs:
  - camera
  - channel-matrix
  targets:
  - channel
  evidence:
  - zenodo-record
  - challenge-page
  - icassp-paper
  notes: The released challenge evaluates future SRS prediction; the originally advertised beam-prediction track is not mapped because it is not part of the released v1 task set/results.
  context:
    environments:
    - indoor
    - laboratory
    mobility: configurable
    frequency_regimes:
    - mmwave
caveats:
- text: The official challenge page originally listed a beam-prediction track, but the released Zenodo v1 dataset and final ICASSP 2026 challenge results document three tasks only; beam prediction is therefore not mapped here.
  evidence:
  - zenodo-record
  - challenge-page
