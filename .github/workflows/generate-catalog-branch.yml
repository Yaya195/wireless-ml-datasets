name: Generate catalogue on dataset branch

on:
  push:
    branches:
      - data/add-wireless-datasets
    paths:
      - "data/**"
      - ".github/workflows/generate-catalog-branch.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data/add-wireless-datasets

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install project dependencies
        run: uv sync --locked --dev

      - name: Validate source metadata
        run: |
          uv run python scripts/validate.py
          uv run python scripts/check_duplicates.py
          uv run python scripts/audit_task_coverage.py
          uv run python scripts/audit_technology_coverage.py

      - name: Generate catalogue
        run: uv run python scripts/build.py

      - name: Commit generated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md catalog dist
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Regenerate catalogue"
            git push origin HEAD:data/add-wireless-datasets
          fi
