name: Validate catalogue

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --locked --dev

      - name: Validate metadata
        run: uv run python scripts/validate.py

      - name: Check duplicates
        run: uv run python scripts/check_duplicates.py

      - name: Audit task coverage
        run: uv run python scripts/audit_task_coverage.py

      - name: Audit technology coverage
        run: uv run python scripts/audit_technology_coverage.py

      - name: Enforce generated-artifact consistency
        run: uv run python scripts/build.py --check

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check scripts tests
