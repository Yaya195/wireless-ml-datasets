name: Validate catalogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install project dependencies
        run: uv sync --locked --dev

      - name: Validate structured metadata
        run: uv run python scripts/validate.py

      - name: Check duplicate dataset identities
        run: uv run python scripts/check_duplicates.py

      - name: Audit task coverage
        run: uv run python scripts/audit_task_coverage.py

      - name: Audit technology coverage
        run: uv run python scripts/audit_technology_coverage.py

      - name: Check generated catalogue
        run: uv run python scripts/build.py --check

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check scripts tests
